
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C.F. Adolfo Ferreira de Carvalho</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eaf2fb, #f7f9fc);
      color: #26374a;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      padding: 38px 28px;
      text-align: center;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(20, 50, 80, .10);
    }

    .logo {
      width: 65px;
      height: 65px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      background: #287bc7;
      color: white;
      font-size: 39px;
      font-weight: bold;
    }

    h1 {
      margin: 0 0 12px;
      color: #153d66;
      font-size: 21px;
    }

    p {
      color: #71849a;
      font-size: 13px;
      line-height: 1.6;
    }

    #googleButton {
      display: flex;
      justify-content: center;
      margin-top: 28px;
      min-height: 42px;
    }

    #mensagem {
      margin-top: 20px;
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .rodape {
      margin-top: 30px;
      color: #9aa8b7;
      font-size: 10px;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <div class="logo">+</div>

    <h1>C.F. Adolfo Ferreira de Carvalho</h1>

    <p>Sistema interno de gestão de solicitações</p>
    <p>Entre utilizando sua conta Google autorizada.</p>

    <div id="googleButton"></div>
    <div id="mensagem" role="status"></div>

    <div class="rodape">
      Acesso restrito aos profissionais autorizados
    </div>
  </main>

  <script>
    const CLIENT_ID =
      '297472151826-cn629paqafmt18sj7it5sivm5hbp5olk.apps.googleusercontent.com';

    function iniciarLogin() {
      if (!window.google || !google.accounts) {
        document.getElementById('mensagem').textContent =
          'Carregando autenticação Google. Atualize a página em alguns segundos.';
        return;
      }

      google.accounts.id.initialize({
        client_id: CLIENT_ID,
        callback: receberCredencial
      });

      google.accounts.id.renderButton(
        document.getElementById('googleButton'),
        {
          theme: 'outline',
          size: 'large',
          shape: 'rectangular',
          text: 'signin_with',
          width: 280
        }
      );
    }

    function receberCredencial(resposta) {
      const mensagem = document.getElementById('mensagem');

      mensagem.style.color = '#71849a';
      mensagem.textContent =
        'Credencial recebida. A integração com o servidor será realizada na próxima etapa.';

      // Não armazenamos nem transmitimos o token nesta etapa.
      console.log('Login Google iniciado.');
    }

    window.addEventListener('load', iniciarLogin);
  </script>
</body>
</html>
