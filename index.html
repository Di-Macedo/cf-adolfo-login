
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C.F. Adolfo Ferreira de Carvalho</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eaf2fb, #f7f9fc);
      color: #26374a;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 40px 28px;
      text-align: center;
      background: white;
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(20,50,80,.10);
    }

    .logo {
      width: 65px;
      height: 65px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      background: #287bc7;
      color: white;
      font-size: 39px;
      font-weight: bold;
    }

    h1 {
      color: #153d66;
      font-size: 21px;
      margin-bottom: 12px;
    }

    p {
      color: #71849a;
      font-size: 13px;
      line-height: 1.6;
    }

    .acessar {
      display: inline-block;
      margin-top: 25px;
      padding: 15px 28px;
      border-radius: 9px;
      background: #287bc7;
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      transition: background .2s;
    }

    .acessar:hover {
      background: #155b9b;
    }

    .rodape {
      margin-top: 30px;
      color: #9aa8b7;
      font-size: 10px;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">+</div>

    <h1>C.F. Adolfo Ferreira de Carvalho</h1>

    <p>Sistema interno de gestão de solicitações</p>
    <p>Acesse a plataforma para consultar e gerenciar as solicitações.</p>

    <a
      class="acessar"
      href="https://script.google.com/macros/s/AKfycbzNj8IiposGRpuYNfPdxPuHAELXkV1hGFwkk-2H8XqdlwIKpMWKpu7MRSX-iZSx6hdx/exec"
      target="_blank"
      rel="noopener noreferrer">
      ACESSAR SISTEMA
    </a>

    <div class="rodape">
      Acesso restrito aos profissionais autorizados
    </div>
  </main>
</body>
</html>
